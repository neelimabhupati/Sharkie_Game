<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharkie</title>
    <link rel="stylesheet" href="style.css">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/life-status-bar.class.js"></script>
    <script src="models/coin-status-bar.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="./models/bottle-status-bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/jellyfish.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/thowable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/levels/level1.js"></script>
    <script src="javascript/game.js"></script>
</head>

<body>
    <div id="start-screen">
        <h1>Neelima's Sharkie</h1>

        <div class="start-screen-content">
            <img src="./images/Grafiken-Sharkie/3. Background/babyshark_bg.jpg" alt="Underwater scene for Sharkie">
            <nav class="start-menu" aria-label="Start menu">
                <button id="start-button" type="button" onclick="startGame()">
                    Start Game
                </button>
                <button id="game-info-button" type="button">
                    Game Info
                </button>
                <button id="game-info-button" type="button">
                    Credits
                </button>
                <button id="game-info-button" type="button">
                    Impressum
                </button>
            </nav>
        </div>
    </div>

    <div id="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <button id="replay-button" type="button" onclick="replayGame()">
            Replay
        </button>

        <button id="fullscreen-button" type="button" onclick="toggleFullscreen()">
            Fullscreen
        </button>
        
    </div>

</body>

</html>
